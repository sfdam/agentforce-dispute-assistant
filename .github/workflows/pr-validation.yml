# Runs on every pull request towards main:
#   1. static checks (Prettier, Salesforce Code Analyzer)
#   2. check-only deploy with all local Apex tests on the CI org
# The PR can be merged only if this workflow is green (branch protection).
name: PR validation

on:
  pull_request:
    branches: [main]
    paths:
      - "force-app/**"
      - "manifest/**"
      - ".github/workflows/**"
      - "package.json"

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prettier (format check)
        run: npm run prettier:verify

      - name: Install Salesforce CLI and Code Analyzer
        run: |
          npm install --global @salesforce/cli
          sf plugins install code-analyzer

      - name: Salesforce Code Analyzer
        run: |
          sf code-analyzer run \
            --workspace force-app \
            --rule-selector Recommended \
            --severity-threshold 2 \
            --output-file code-analyzer-results.html

      - name: Upload Code Analyzer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer-report
          path: code-analyzer-results.html

  validate-deploy:
    name: Validate deploy + Apex tests
    needs: static-checks
    runs-on: ubuntu-latest
    environment: ci-org
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to CI org
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > authfile
          sf org login sfdx-url --sfdx-url-file authfile --alias ci-org
          rm authfile

      - name: Check-only deploy with local tests
        run: |
          sf project deploy validate \
            --source-dir force-app \
            --target-org ci-org \
            --test-level RunLocalTests \
            --coverage-formatters json-summary \
            --results-dir deploy-results \
            --wait 30

      - name: Enforce 85% Apex coverage
        run: node scripts/check-coverage.js deploy-results 85

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-test-results
          path: deploy-results
